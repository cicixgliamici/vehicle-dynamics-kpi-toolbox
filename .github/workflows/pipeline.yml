name: Vehicle Dynamics Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - name: Run MATLAB Code Analyzer
        uses: matlab-actions/run-command@v2
        with:
          command: |
            % Check all files in src/
            files = dir('src/**/*.m');
            for i = 1:length(files)
                res = checkcode(fullfile(files(i).folder, files(i).name));
                if ~isempty(res)
                    fprintf('Lint issues in %s:\n', files(i).name);
                    disp(res);
                end
            end

  test:
    name: Unit Testing
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - name: Run all tests
        uses: matlab-actions/run-tests@v2
        with:
          select-by-folder: tests

  deploy-results:
    name: Analysis & Artifact Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - name: Generate Large Batch Results & Package
        uses: matlab-actions/run-command@v2
        with:
          command: |
            run('startup.m');
            generateLargeBatch(20);
            run('scripts/runBatchAnalysis.m');
            run('scripts/packageToolbox.m');
      
      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: results/build_log.txt
      
      - name: Upload KPI Summary
        uses: actions/upload-artifact@v4
        with:
          name: kpi-summary-report
          path: results/kpi_summary.csv

      - name: Upload Generated Figures
        uses: actions/upload-artifact@v4
        with:
          name: batch-figures
          path: figures/*.png
